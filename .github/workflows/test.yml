name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check all shell scripts
        run: |
          for f in bin/devguard bin/*.sh status.sh install.sh uninstall.sh bootstrap.sh lib.sh components/*.sh hooks/*.sh tests/*.sh; do
            bash -n "$f"
          done
      - name: Lint shell scripts
        run: |
          command -v shellcheck >/dev/null || brew install shellcheck
          shellcheck -S warning bin/devguard bin/*.sh status.sh install.sh uninstall.sh bootstrap.sh lib.sh components/*.sh hooks/*.sh tests/*.sh
      - name: Run core install/uninstall tests
        run: /bin/bash tests/test-kit.sh
      - name: Run component & doctor tests
        run: /bin/bash tests/test-components.sh
      - name: Run gate tests
        run: /bin/bash tests/test-gate.sh
      - name: Run review tests
        run: /bin/bash tests/test-review.sh
      - name: Run eval tests
        run: /bin/bash tests/test-eval.sh

  test-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Validate bootstrap.ps1 PowerShell syntax
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD/bootstrap.ps1", [ref]$null, [ref]$errors)
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
      - name: Syntax check all shell and Python scripts on Windows
        run: |
          for f in bin/devguard bin/*.sh status.sh install.sh uninstall.sh bootstrap.sh lib.sh components/*.sh hooks/*.sh tests/*.sh; do
            bash -n "$f"
          done
          python -I -m py_compile bin/pjm_sync.py tests/sync_race.py tests/sync_lock.py bin/eval.py
      - name: Run core install/uninstall tests on Windows
        run: bash tests/test-kit.sh
      - name: Run gate tests on Windows
        run: bash tests/test-gate.sh
      - name: Run review tests on Windows
        run: bash tests/test-review.sh
